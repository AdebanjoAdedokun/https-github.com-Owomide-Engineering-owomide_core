# JWT_SECRET and DEV_USER_PASSWORD live in the gateway-secrets Secret instead
# of here (see gateway/deployment.yaml) — they're credentials, not config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  PORT: "5000"
  HOST: "0.0.0.0"
  LOG_LEVEL: info
  CORS_ORIGIN: "*"
  JWT_EXPIRES_IN: "3600"
  DEV_USER_EMAIL: dev@owomide.local
  DEV_USER_ORG_ID: org-dev
  DEV_USER_ID: user-dev
  DEV_USER_ROLES: admin
  PROPOSAL_SERVICE_URL: http://proposal:50051
  CATALOG_SERVICE_URL: http://catalog:50052
  MARGIN_SERVICE_URL: http://margin:50053
  GOVERNANCE_SERVICE_URL: http://governance:50054
  DATA_PIPELINE_SERVICE_URL: http://data-pipeline:50055
