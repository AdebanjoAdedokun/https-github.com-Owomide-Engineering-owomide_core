apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: owomide/gateway
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: CATALOG_GATEWAY_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: gateway-service-secret
            - name: DATA_PIPELINE_GATEWAY_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: data-pipeline-secrets
                  key: gateway-service-secret
            - name: MARGIN_GATEWAY_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: margin-secrets
                  key: gateway-service-secret
            - name: PROPOSAL_GATEWAY_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: proposal-secrets
                  key: gateway-service-secret
            - name: GOVERNANCE_GATEWAY_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: governance-secrets
                  key: gateway-service-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: jwt-secret
            - name: DEV_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: dev-user-password
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
