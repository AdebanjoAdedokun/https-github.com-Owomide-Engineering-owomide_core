apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: owomide-web
  labels:
    app.kubernetes.io/name: owomide-web
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: owomide
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.owomide.invalid
      secretName: replace-me-tls
  rules:
    # Gateway API, reached by frontends hosted outside this cluster
    # (marketing/workspace serve from Cloudflare Workers, not k8s).
    - host: api.owomide.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 5000
