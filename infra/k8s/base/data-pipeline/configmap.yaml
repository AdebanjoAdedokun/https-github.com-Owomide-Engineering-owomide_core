apiVersion: v1
kind: ConfigMap
metadata:
  name: data-pipeline-config
data:
  DATA_PIPELINE_GRPC_HOST: 0.0.0.0
  DATA_PIPELINE_GRPC_PORT: "50055"
  DATA_PIPELINE_HEALTH_HOST: 0.0.0.0
  DATA_PIPELINE_HEALTH_PORT: "8080"
  DATA_PIPELINE_SERVICE_JWT_ISSUER: owomide-internal
  DATA_PIPELINE_SERVICE_JWT_AUDIENCE: data-pipeline
  DATA_PIPELINE_OBJECT_STORE_ENDPOINT: minio:9000
  DATA_PIPELINE_OBJECT_STORE_SECURE: "false"
  DATA_PIPELINE_OBJECT_STORE_BUCKET: owomide-imports
  DATA_PIPELINE_CATALOG_SERVICE_URL: catalog:50052
  DATA_PIPELINE_CATALOG_TIMEOUT_SECONDS: "10"
  KAFKA_BROKERS: kafka:9092
  DATA_PIPELINE_KAFKA_CLIENT_ID: data-pipeline-worker
  DATA_PIPELINE_OUTBOX_BATCH_SIZE: "100"
  DATA_PIPELINE_OUTBOX_LEASE_SECONDS: "30"
  DATA_PIPELINE_UPLOAD_MAX_BYTES: "52428800"
  DATA_PIPELINE_IMPORT_MAX_ROWS: "250000"
  DATA_PIPELINE_IMPORT_MAX_COLUMNS: "500"
  DATA_PIPELINE_IMPORT_INSERT_BATCH_SIZE: "1000"
  DATA_PIPELINE_WORKER_LEASE_SECONDS: "300"
  DATA_PIPELINE_WORKER_RETRY_BASE_SECONDS: "5"
  DATA_PIPELINE_WORKER_POLL_SECONDS: "2"
  LOG_LEVEL: INFO
