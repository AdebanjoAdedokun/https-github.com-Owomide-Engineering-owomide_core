apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Select production images promoted by the release workflow.
images:
  - name: owomide/gateway
    newTag: prod
  - name: owomide/catalog
    newTag: prod
  - name: owomide/data-pipeline
    newTag: prod
  - name: owomide/margin
    newTag: prod
  # Release promotion replaces these placeholders with the exact image digests
  # already verified in staging; production never rebuilds the frontend.
  - name: owomide/marketing
    newName: ghcr.io/owomide-engineering/owomide-marketing
    newTag: sha-000000000000
  - name: owomide/workspace
    newName: ghcr.io/owomide-engineering/owomide-workspace
    newTag: sha-000000000000

# Run two public-edge replicas in production for rolling availability.
replicas:
  - name: gateway
    count: 2
  - name: marketing
    count: 2
  - name: workspace
    count: 2

# Production-grade resource requests and storage.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=owomide-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: owomide-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: owomide.com
      - op: replace
        path: /spec/rules/1/host
        value: app.owomide.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: owomide.com
      - op: replace
        path: /spec/tls/0/hosts/1
        value: app.owomide.com
      - op: replace
        path: /spec/tls/0/secretName
        value: owomide-production-tls
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: margin-config
      data:
        ENVIRONMENT: production
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
      spec:
        template:
          spec:
            containers:
              - name: gateway
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: 2000m
                    memory: 1Gi
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-pvc
      spec:
        resources:
          requests:
            storage: 100Gi
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: minio-pvc
      spec:
        resources:
          requests:
            storage: 500Gi
