apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Select staging images built by CI.
images:
  - name: owomide/gateway
    newTag: staging
  - name: owomide/catalog
    newTag: staging
  - name: owomide/data-pipeline
    newTag: staging
  - name: owomide/margin
    newTag: staging

# Staging-sized resource requests and larger storage.
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: owomide-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.owomide.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.owomide.com
      - op: replace
        path: /spec/tls/0/secretName
        value: owomide-staging-tls
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: margin-config
      data:
        ENVIRONMENT: staging
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
      spec:
        template:
          spec:
            containers:
              - name: gateway
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 512Mi
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: minio-pvc
      spec:
        resources:
          requests:
            storage: 20Gi
