apiVersion: v1
kind: Secret
metadata:
  name: data-pipeline-secrets
type: Opaque
stringData:
  database-url: postgresql://data_pipeline_svc:dev_data_pipeline@postgres:5432/owomide
  gateway-service-secret: dev-only-data-pipeline-gateway-secret-change-me
  service-secrets-json: >-
    {"gateway_svc":"dev-only-data-pipeline-gateway-secret-change-me","margin_svc":"dev-only-data-pipeline-margin-secret-change-me"}
  object-store-access-key: minioadmin
  object-store-secret-key: minioadmin
  catalog-service-secret: dev-only-catalog-pipeline-secret-change-me
