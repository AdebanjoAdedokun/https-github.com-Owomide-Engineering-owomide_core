apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Extend the shared base — inherits all resources (postgres, redis, minio, kafka, gateway).
# Minimal overrides: this is local dev, so the base dev values are fine as-is.
resources:
  - ../../base
  - catalog-secrets.yaml
  - data-pipeline-secrets.yaml
  - margin-secrets.yaml
  # - bus-smoke

patches:
  # OrbStack shares the host Docker daemon, so local frontend images are never
  # pulled from a registry. Skaffold is responsible for building these names.
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=owomide-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Local development uses plain HTTP and hosts supplied through /etc/hosts.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: owomide-web
    patch: |-
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
      - op: replace
        path: /spec/rules/0/host
        value: owomide.local
      - op: replace
        path: /spec/rules/1/host
        value: app.owomide.local
      - op: remove
        path: /spec/tls
