apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Extend the shared base — inherits redis, minio, kafka, and the app
# services. Postgres is local-dev only (staging/prod use Supabase instead),
# so it's added explicitly here rather than living in the shared base.
# marketing/workspace are not deployed here either — local dev runs them via
# `make marketing-dev` / `make workspace-dev` (plain Vite dev servers on
# 4173/4174), not through this cluster.
resources:
  - ../../base
  - ../../base/postgres
  - catalog-secrets.yaml
  - data-pipeline-secrets.yaml
  - margin-secrets.yaml
  # - bus-smoke

patches:
  # Local development uses plain HTTP and a host supplied through /etc/hosts.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: owomide-web
    patch: |-
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
      - op: replace
        path: /spec/rules/0/host
        value: api.owomide.local
      - op: remove
        path: /spec/tls
