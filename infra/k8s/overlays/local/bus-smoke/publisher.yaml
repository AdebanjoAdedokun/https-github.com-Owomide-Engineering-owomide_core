apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-smoke-publisher
spec:
  selector:
    matchLabels:
      app: bus-smoke-publisher
  template:
    metadata:
      labels:
        app: bus-smoke-publisher
    spec:
      containers:
        - name: publisher
          image: owomide/bus-smoke
          imagePullPolicy: Never
          command: ["node", "src/lib/bus-smoke/dist/publisher.js"]
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: bus-smoke-publisher
            - name: BUS_SMOKE_TOPIC
              value: test.ping
            - name: BUS_SMOKE_INTERVAL_MS
              value: "5000"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
