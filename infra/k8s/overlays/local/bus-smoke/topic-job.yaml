apiVersion: batch/v1
kind: Job
metadata:
  name: bus-smoke-topics
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: apache/kafka:3.7.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                echo "waiting for kafka"
                sleep 2
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic test.ping --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic test.ping.dlq --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic test.ping
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic test.ping.dlq
