  gateway-service-secret: dev-only-margin-gateway-secret-change-me
  service-secrets-json: >-
    {"gateway_svc":"dev-only-margin-gateway-secret-change-me","proposal_svc":"dev-only-margin-proposal-secret-change-me"}
  catalog-service-secret: dev-only-catalog-margin-secret-change-me
  intelligence-service-secret: dev-only-data-pipeline-margin-secret-change-me
  rbac-service-secret: dev-only-rbac-margin-secret-change-me
