apiVersion: v1
kind: Secret
metadata:
  name: governance-secrets
type: Opaque
stringData:
  database-url: postgresql://governance_svc:dev_governance@postgres:5432/owomide
  gateway-service-secret: dev-only-governance-gateway-secret-change-me
  catalog-service-secret: dev-only-catalog-governance-secret-change-me
  rbac-service-secret: dev-only-rbac-governance-secret-change-me
  object-store-access-key: minioadmin
  object-store-secret-key: minioadmin
  service-secrets-json: >-
    {"gateway_svc":"dev-only-governance-gateway-secret-change-me"}
