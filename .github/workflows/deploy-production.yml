name: Promote frontends to production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Staging source commit SHA for the release record
        required: true
        type: string
      marketing_digest:
        description: Staging marketing digest (sha256:...)
        required: true
        type: string
      workspace_digest:
        description: Staging workspace digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      MARKETING_DIGEST: ${{ inputs.marketing_digest }}
      WORKSPACE_DIGEST: ${{ inputs.workspace_digest }}
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: owomide-engineering
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Validate immutable release record
        run: |
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s' "$MARKETING_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$WORKSPACE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'

      - uses: imranismail/setup-kustomize@v2

      - name: Configure cluster access
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          test -n "$KUBECONFIG_BASE64"
          mkdir -p "$RUNNER_TEMP/owomide-kube"
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/owomide-kube/config"
          chmod 600 "$RUNNER_TEMP/owomide-kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/owomide-kube/config" >> "$GITHUB_ENV"

      - name: Promote the tested images
        working-directory: infra/k8s/overlays/prod/frontend
        run: |
          kustomize edit set image \
            "owomide/marketing=$REGISTRY/$IMAGE_NAMESPACE/owomide-marketing@$MARKETING_DIGEST" \
            "owomide/workspace=$REGISTRY/$IMAGE_NAMESPACE/owomide-workspace@$WORKSPACE_DIGEST"
          kubectl apply -k .
          kubectl rollout status deployment/marketing --timeout=180s
          kubectl rollout status deployment/workspace --timeout=180s
          {
            echo "### Frontend production promotion"
            printf 'Source: %s\n' "$SOURCE_SHA"
            printf 'Marketing: %s\n' "$MARKETING_DIGEST"
            printf 'Workspace: %s\n' "$WORKSPACE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
