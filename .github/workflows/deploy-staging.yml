name: Deploy frontends to staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-staging
  cancel-in-progress: true

jobs:
  # Mirrors the per-service filter in ci.yml's own `changes` job, so this
  # workflow only builds/deploys when apps/ (or a shared package) actually
  # changed — not on every backend-only push to main.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - uses: tj-actions/changed-files@v45
        id: filter
        with:
          since_last_remote_commit: true
          files_yaml: |
            frontend:
              - 'apps/marketing/**'
              - 'apps/workspace/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  deploy:
    needs: changes
    if: >-
      ${{
        vars.ENABLE_STAGING_DEPLOY == 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            needs.changes.outputs.frontend == 'true'
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: owomide-engineering
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish marketing
        id: marketing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketing/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/owomide-marketing:sha-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing

      - name: Build and publish workspace
        id: workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/workspace/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/owomide-workspace:sha-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace

      - uses: imranismail/setup-kustomize@v2

      - name: Configure cluster access
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          test -n "$KUBECONFIG_BASE64"
          mkdir -p "$RUNNER_TEMP/owomide-kube"
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/owomide-kube/config"
          chmod 600 "$RUNNER_TEMP/owomide-kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/owomide-kube/config" >> "$GITHUB_ENV"

      - name: Deploy immutable frontend images
        working-directory: infra/k8s/overlays/staging/frontend
        env:
          MARKETING_DIGEST: ${{ steps.marketing.outputs.digest }}
          WORKSPACE_DIGEST: ${{ steps.workspace.outputs.digest }}
        run: |
          kustomize edit set image \
            "owomide/marketing=$REGISTRY/$IMAGE_NAMESPACE/owomide-marketing@$MARKETING_DIGEST" \
            "owomide/workspace=$REGISTRY/$IMAGE_NAMESPACE/owomide-workspace@$WORKSPACE_DIGEST"
          kubectl apply -k .
          kubectl rollout status deployment/marketing --timeout=180s
          kubectl rollout status deployment/workspace --timeout=180s
          {
            echo "### Frontend staging release"
            printf 'Source: %s\n' "$IMAGE_TAG"
            printf 'Marketing: %s\n' "$MARKETING_DIGEST"
            printf 'Workspace: %s\n' "$WORKSPACE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
