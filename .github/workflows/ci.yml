name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proposal-integrity:
    name: Proposal integrity integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: 8.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @owomide/bus build
      - run: pnpm --filter @owomide/proposal build
      - name: Test real PostgreSQL authority, scope and publication boundaries
        working-directory: src/proposal
        run: >-
          pnpm exec vitest run --config vitest.integration.config.ts
          src/tests/integration/proposal-approve.integration.test.ts
          src/tests/integration/proposal-publish.integration.test.ts
          src/tests/integration/build-scope.integration.test.ts
          src/tests/integration/preview-change-set.integration.test.ts
          src/tests/integration/scheduled-rollout.integration.test.ts
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/margin/go.mod
          cache-dependency-path: src/margin/go.sum

      - name: Check for Go services
        id: go-check
        run: |
          if find src -name "main.go" | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: golangci-lint
        if: steps.go-check.outputs.has_go == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: src/margin

      - name: Run lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Run tests
        run: bazel test //... --config=ci

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/margin/go.mod

      - name: Run Margin tests
        run: go test ./...
        working-directory: src/margin

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build frontends
        run: pnpm check:frontends

      - name: Validate accepted MVP delivery evidence and links
        run: node tools/scripts/product-plan/validate-plan.mjs

  manifests-validate:
    name: Validate k8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Guard: skip all subsequent steps until infra/k8s/ exists (F0.2)
      - name: Check if infra/k8s exists
        id: guard
        run: |
          if [ -d infra/k8s ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Kustomize
        if: steps.guard.outputs.exists == 'true'
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeconform
        if: steps.guard.outputs.exists == 'true'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz && sudo mv kubeconform /usr/local/bin/

      - name: Validate local overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/local | kubeconform -strict -summary

      - name: Validate staging overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/staging | kubeconform -strict -summary

      - name: Validate staging frontend release overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/staging/frontend | kubeconform -strict -summary

      - name: Validate prod overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/prod | kubeconform -strict -summary

      - name: Validate production frontend release overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/prod/frontend | kubeconform -strict -summary

  # Detect which services have changed so we only build affected images
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway_any_changed }}
      catalog: ${{ steps.filter.outputs.catalog_any_changed }}
      proposal: ${{ steps.filter.outputs.proposal_any_changed }}
      governance: ${{ steps.filter.outputs.governance_any_changed }}
      notify: ${{ steps.filter.outputs.notify_any_changed }}
      data-pipeline: ${{ steps.filter.outputs.data-pipeline_any_changed }}
      margin: ${{ steps.filter.outputs.margin_any_changed }}
      marketing: ${{ steps.filter.outputs.marketing_any_changed }}
      workspace: ${{ steps.filter.outputs.workspace_any_changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: tj-actions/changed-files@v45
        id: filter
        with:
          files_yaml: |
            gateway:
              - 'src/gateway/**'
            catalog:
              - 'src/catalog/**'
            proposal:
              - 'src/proposal/**'
            governance:
              - 'src/governance/**'
            notify:
              - 'src/notify/**'
            data-pipeline:
              - 'src/data-pipeline/**'
            margin:
              - 'src/margin/**'
            marketing:
              - 'apps/marketing/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            workspace:
              - 'apps/workspace/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # All image builds use the repo root as context because pnpm-lock.yaml lives there (workspace).
  # Each Dockerfile selectively COPYs only what its service needs.

  build-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/gateway/Dockerfile
          push: false
          tags: owomide/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-catalog:
    name: Build catalog image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.catalog == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/catalog/Dockerfile
          push: false
          tags: owomide/catalog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proposal:
    name: Build proposal image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.proposal == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/proposal/Dockerfile
          push: false
          tags: owomide/proposal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-governance:
    name: Build governance image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.governance == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/governance/Dockerfile
          push: false
          tags: owomide/governance:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-notify:
    name: Build notify image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.notify == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/notify/Dockerfile
          push: false
          tags: owomide/notify:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-data-pipeline:
    name: Build data-pipeline image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.data-pipeline == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/data-pipeline/Dockerfile
          push: false
          tags: owomide/data-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-margin:
    name: Build margin image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.margin == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/margin/Dockerfile
          push: false
          tags: owomide/margin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-marketing:
    name: Build marketing image
    runs-on: ubuntu-latest
    needs: [frontend, changes]
    if: needs.changes.outputs.marketing == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketing/Dockerfile
          push: false
          tags: owomide/marketing:${{ github.sha }}
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing

  build-workspace:
    name: Build workspace image
    runs-on: ubuntu-latest
    needs: [frontend, changes]
    if: needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/workspace/Dockerfile
          push: false
          tags: owomide/workspace:${{ github.sha }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace
