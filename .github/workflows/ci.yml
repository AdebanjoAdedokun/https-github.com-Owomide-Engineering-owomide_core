          cache-to: type=gha,mode=max

  build-rbac:
    name: Build rbac image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.rbac == 'true' || github.event_name == 'workflow_dispatch'
