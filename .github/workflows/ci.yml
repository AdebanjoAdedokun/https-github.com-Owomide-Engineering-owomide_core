name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual: force-build+push every image regardless of the changes filter
  # below, for bootstrapping GHCR the first time a service gets wired up
  # without its src/ actually changing (e.g. new k8s manifests/CI wiring).
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/margin/go.mod
          cache-dependency-path: src/margin/go.sum

      - name: Check for Go services
        id: go-check
        run: |
          if find src -name "main.go" | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: golangci-lint
        if: steps.go-check.outputs.has_go == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: src/margin

      - name: Run lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Run tests
        run: bazel test //... --config=ci

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/margin/go.mod

      - name: Run Margin tests
        run: go test ./...
        working-directory: src/margin

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build frontends
        run: pnpm check:frontends

      - name: Validate accepted MVP delivery evidence and links
        run: node tools/scripts/product-plan/validate-plan.mjs

  manifests-validate:
    name: Validate k8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Guard: skip all subsequent steps until infra/k8s/ exists (F0.2)
      - name: Check if infra/k8s exists
        id: guard
        run: |
          if [ -d infra/k8s ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Kustomize
        if: steps.guard.outputs.exists == 'true'
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeconform
        if: steps.guard.outputs.exists == 'true'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz && sudo mv kubeconform /usr/local/bin/

      - name: Validate local overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/local | kubeconform -strict -summary

      - name: Validate staging overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/staging | kubeconform -strict -summary

      - name: Validate prod overlay
        if: steps.guard.outputs.exists == 'true'
        run: kustomize build infra/k8s/overlays/prod | kubeconform -strict -summary

  # Detect which services have changed so we only build affected images
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway_any_changed }}
      catalog: ${{ steps.filter.outputs.catalog_any_changed }}
      proposal: ${{ steps.filter.outputs.proposal_any_changed }}
      governance: ${{ steps.filter.outputs.governance_any_changed }}
      notify: ${{ steps.filter.outputs.notify_any_changed }}
      data-pipeline: ${{ steps.filter.outputs.data-pipeline_any_changed }}
      margin: ${{ steps.filter.outputs.margin_any_changed }}
      rbac: ${{ steps.filter.outputs.rbac_any_changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: tj-actions/changed-files@v45
        id: filter
        with:
          files_yaml: |
            gateway:
              - 'src/gateway/**'
            catalog:
              - 'src/catalog/**'
            proposal:
              - 'src/proposal/**'
            governance:
              - 'src/governance/**'
            notify:
              - 'src/notify/**'
            data-pipeline:
              - 'src/data-pipeline/**'
            margin:
              - 'src/margin/**'
            rbac:
              - 'src/rbac/**'

  # All image builds use the repo root as context because pnpm-lock.yaml lives there (workspace).
  # Each Dockerfile selectively COPYs only what its service needs.

  build-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/gateway/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/gateway:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/gateway:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-catalog:
    name: Build catalog image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.catalog == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/catalog/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/catalog:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/catalog:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proposal:
    name: Build proposal image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.proposal == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/proposal/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/proposal:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/proposal:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-governance:
    name: Build governance image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.governance == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/governance/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/governance:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/governance:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-notify:
    name: Build notify image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.notify == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/notify/Dockerfile
          push: false
          tags: owomide/notify:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-data-pipeline:
    name: Build data-pipeline image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.data-pipeline == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/data-pipeline/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/data-pipeline:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/data-pipeline:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-margin:
    name: Build margin image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.margin == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
