name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install gateway deps
        run: pnpm install --frozen-lockfile
        working-directory: src/gateway

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: binary

      - name: Run lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Run tests
        run: bazel test //... --config=ci

  manifests-validate:
    name: Validate k8s Manifests
    runs-on: ubuntu-latest
    # Skip until infra/k8s/ exists (F0.2)
    if: ${{ hashFiles('infra/k8s/**') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeval
        run: |
          curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz \
            | tar xz && sudo mv kubeval /usr/local/bin/

      - name: Validate local overlay
        run: kustomize build infra/k8s/overlays/local | kubeval --strict

      - name: Validate staging overlay
        run: kustomize build infra/k8s/overlays/staging | kubeval --strict

      - name: Validate prod overlay
        run: kustomize build infra/k8s/overlays/prod | kubeval --strict

  # Detect which services have changed so we only build affected images
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      catalog: ${{ steps.filter.outputs.catalog }}
      proposal: ${{ steps.filter.outputs.proposal }}
      governance: ${{ steps.filter.outputs.governance }}
      notify: ${{ steps.filter.outputs.notify }}
      data-pipeline: ${{ steps.filter.outputs.data-pipeline }}
      margin: ${{ steps.filter.outputs.margin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'src/gateway/**'
            catalog:
              - 'src/catalog/**'
            proposal:
              - 'src/proposal/**'
            governance:
              - 'src/governance/**'
            notify:
              - 'src/notify/**'
            data-pipeline:
              - 'src/data-pipeline/**'
            margin:
              - 'src/margin/**'

  # All image builds use the repo root as context because pnpm-lock.yaml lives there (workspace).
  # Each Dockerfile selectively COPYs only what its service needs.

  build-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/gateway/Dockerfile
          push: false
          tags: owomide/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-catalog:
    name: Build catalog image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.catalog == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/catalog/Dockerfile
          push: false
          tags: owomide/catalog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proposal:
    name: Build proposal image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.proposal == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/proposal/Dockerfile
          push: false
          tags: owomide/proposal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-governance:
    name: Build governance image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.governance == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/governance/Dockerfile
          push: false
          tags: owomide/governance:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-notify:
    name: Build notify image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.notify == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/notify/Dockerfile
          push: false
          tags: owomide/notify:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-data-pipeline:
    name: Build data-pipeline image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.data-pipeline == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/data-pipeline/Dockerfile
          push: false
          tags: owomide/data-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-margin:
    name: Build margin image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.margin == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/margin/Dockerfile
          push: false
          tags: owomide/margin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
