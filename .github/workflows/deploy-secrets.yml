name: Deploy Backend Secrets

# Manual only — syncs real Secrets onto the staging cluster from GitHub
# environment secrets. Real values never touch git. Run this once, and again
# only when a secret actually rotates — routine deploys use deploy-backend.yml
# instead, which doesn't touch secrets.
#
# Scoped to the services that currently have k8s manifests (gateway, catalog,
# data-pipeline, margin, proposal, governance, rbac). notify has no manifests
# yet — it's still an unimplemented stub, nothing to deploy.
#
# Required secrets (GitHub repo Settings → Environments → infra-vultr):
#   KUBECONFIG_BASE64                  (already set — shared with infra-ingress-nginx.yml)
#   GHCR_PULL_TOKEN                    PAT (classic, read:packages) for the cluster to pull private GHCR images
#   GATEWAY_JWT_SECRET
#   GATEWAY_DEV_USER_PASSWORD
#   CATALOG_DATABASE_URL
#   CATALOG_GATEWAY_SERVICE_SECRET
#   CATALOG_SERVICE_SECRETS_JSON
#   DATA_PIPELINE_DATABASE_URL
#   DATA_PIPELINE_GATEWAY_SERVICE_SECRET
#   DATA_PIPELINE_SERVICE_SECRETS_JSON
#   DATA_PIPELINE_OBJECT_STORE_ACCESS_KEY
#   DATA_PIPELINE_OBJECT_STORE_SECRET_KEY
#   DATA_PIPELINE_CATALOG_SERVICE_SECRET
#   MARGIN_DATABASE_URL
#   MARGIN_GATEWAY_SERVICE_SECRET
#   MARGIN_PROPOSAL_SERVICE_SECRET
#   MARGIN_SERVICE_SECRETS_JSON
#   MARGIN_CATALOG_SERVICE_SECRET
#   MARGIN_INTELLIGENCE_SERVICE_SECRET
#   PROPOSAL_DATABASE_URL
#   PROPOSAL_GATEWAY_SERVICE_SECRET
#   PROPOSAL_CATALOG_SERVICE_SECRET
#   PROPOSAL_MARGIN_SERVICE_SECRET
#   PROPOSAL_RBAC_SERVICE_SECRET
#   PROPOSAL_SERVICE_SECRETS_JSON
#   GOVERNANCE_DATABASE_URL
#   GOVERNANCE_GATEWAY_SERVICE_SECRET
#   GOVERNANCE_CATALOG_SERVICE_SECRET
#   GOVERNANCE_RBAC_SERVICE_SECRET
#   GOVERNANCE_OBJECT_STORE_ACCESS_KEY
#   GOVERNANCE_OBJECT_STORE_SECRET_KEY
#   GOVERNANCE_SERVICE_SECRETS_JSON
#   RBAC_DATABASE_URL
#   RBAC_SERVICE_SECRETS_JSON
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync staging secrets
    runs-on: ubuntu-latest
    environment: infra-vultr
    steps:
      - uses: actions/checkout@v6

      - name: Configure cluster access
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          test -n "$KUBECONFIG_BASE64"
          mkdir -p "$RUNNER_TEMP/owomide-kube"
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/owomide-kube/config"
          chmod 600 "$RUNNER_TEMP/owomide-kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/owomide-kube/config" >> "$GITHUB_ENV"

      - name: Sync GHCR pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync gateway secrets
        env:
          JWT_SECRET: ${{ secrets.GATEWAY_JWT_SECRET }}
          DEV_USER_PASSWORD: ${{ secrets.GATEWAY_DEV_USER_PASSWORD }}
        run: |
          kubectl create secret generic gateway-secrets \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --from-literal=dev-user-password="$DEV_USER_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync catalog secrets
        env:
          DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
          GATEWAY_SERVICE_SECRET: ${{ secrets.CATALOG_GATEWAY_SERVICE_SECRET }}
          SERVICE_SECRETS_JSON: ${{ secrets.CATALOG_SERVICE_SECRETS_JSON }}
        run: |
          kubectl create secret generic catalog-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=gateway-service-secret="$GATEWAY_SERVICE_SECRET" \
            --from-literal=service-secrets-json="$SERVICE_SECRETS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync data-pipeline secrets
        env:
          DATABASE_URL: ${{ secrets.DATA_PIPELINE_DATABASE_URL }}
          GATEWAY_SERVICE_SECRET: ${{ secrets.DATA_PIPELINE_GATEWAY_SERVICE_SECRET }}
          SERVICE_SECRETS_JSON: ${{ secrets.DATA_PIPELINE_SERVICE_SECRETS_JSON }}
          OBJECT_STORE_ACCESS_KEY: ${{ secrets.DATA_PIPELINE_OBJECT_STORE_ACCESS_KEY }}
          OBJECT_STORE_SECRET_KEY: ${{ secrets.DATA_PIPELINE_OBJECT_STORE_SECRET_KEY }}
          CATALOG_SERVICE_SECRET: ${{ secrets.DATA_PIPELINE_CATALOG_SERVICE_SECRET }}
        run: |
          kubectl create secret generic data-pipeline-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=gateway-service-secret="$GATEWAY_SERVICE_SECRET" \
            --from-literal=service-secrets-json="$SERVICE_SECRETS_JSON" \
            --from-literal=object-store-access-key="$OBJECT_STORE_ACCESS_KEY" \
            --from-literal=object-store-secret-key="$OBJECT_STORE_SECRET_KEY" \
            --from-literal=catalog-service-secret="$CATALOG_SERVICE_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync margin secrets
        env:
          DATABASE_URL: ${{ secrets.MARGIN_DATABASE_URL }}
          GATEWAY_SERVICE_SECRET: ${{ secrets.MARGIN_GATEWAY_SERVICE_SECRET }}
          PROPOSAL_SERVICE_SECRET: ${{ secrets.MARGIN_PROPOSAL_SERVICE_SECRET }}
          SERVICE_SECRETS_JSON: ${{ secrets.MARGIN_SERVICE_SECRETS_JSON }}
          CATALOG_SERVICE_SECRET: ${{ secrets.MARGIN_CATALOG_SERVICE_SECRET }}
          INTELLIGENCE_SERVICE_SECRET: ${{ secrets.MARGIN_INTELLIGENCE_SERVICE_SECRET }}
        run: |
          kubectl create secret generic margin-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=gateway-service-secret="$GATEWAY_SERVICE_SECRET" \
            --from-literal=proposal-service-secret="$PROPOSAL_SERVICE_SECRET" \
            --from-literal=service-secrets-json="$SERVICE_SECRETS_JSON" \
            --from-literal=catalog-service-secret="$CATALOG_SERVICE_SECRET" \
            --from-literal=intelligence-service-secret="$INTELLIGENCE_SERVICE_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync proposal secrets
        env:
          DATABASE_URL: ${{ secrets.PROPOSAL_DATABASE_URL }}
          GATEWAY_SERVICE_SECRET: ${{ secrets.PROPOSAL_GATEWAY_SERVICE_SECRET }}
          CATALOG_SERVICE_SECRET: ${{ secrets.PROPOSAL_CATALOG_SERVICE_SECRET }}
          MARGIN_SERVICE_SECRET: ${{ secrets.PROPOSAL_MARGIN_SERVICE_SECRET }}
          RBAC_SERVICE_SECRET: ${{ secrets.PROPOSAL_RBAC_SERVICE_SECRET }}
          SERVICE_SECRETS_JSON: ${{ secrets.PROPOSAL_SERVICE_SECRETS_JSON }}
        run: |
          kubectl create secret generic proposal-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=gateway-service-secret="$GATEWAY_SERVICE_SECRET" \
            --from-literal=catalog-service-secret="$CATALOG_SERVICE_SECRET" \
            --from-literal=margin-service-secret="$MARGIN_SERVICE_SECRET" \
            --from-literal=rbac-service-secret="$RBAC_SERVICE_SECRET" \
            --from-literal=service-secrets-json="$SERVICE_SECRETS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync governance secrets
        env:
          DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
          GATEWAY_SERVICE_SECRET: ${{ secrets.GOVERNANCE_GATEWAY_SERVICE_SECRET }}
          CATALOG_SERVICE_SECRET: ${{ secrets.GOVERNANCE_CATALOG_SERVICE_SECRET }}
          RBAC_SERVICE_SECRET: ${{ secrets.GOVERNANCE_RBAC_SERVICE_SECRET }}
          OBJECT_STORE_ACCESS_KEY: ${{ secrets.GOVERNANCE_OBJECT_STORE_ACCESS_KEY }}
          OBJECT_STORE_SECRET_KEY: ${{ secrets.GOVERNANCE_OBJECT_STORE_SECRET_KEY }}
          SERVICE_SECRETS_JSON: ${{ secrets.GOVERNANCE_SERVICE_SECRETS_JSON }}
        run: |
          kubectl create secret generic governance-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=gateway-service-secret="$GATEWAY_SERVICE_SECRET" \
            --from-literal=catalog-service-secret="$CATALOG_SERVICE_SECRET" \
            --from-literal=rbac-service-secret="$RBAC_SERVICE_SECRET" \
            --from-literal=object-store-access-key="$OBJECT_STORE_ACCESS_KEY" \
            --from-literal=object-store-secret-key="$OBJECT_STORE_SECRET_KEY" \
            --from-literal=service-secrets-json="$SERVICE_SECRETS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync rbac secrets
        env:
          DATABASE_URL: ${{ secrets.RBAC_DATABASE_URL }}
          SERVICE_SECRETS_JSON: ${{ secrets.RBAC_SERVICE_SECRETS_JSON }}
        run: |
          kubectl create secret generic rbac-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=service-secrets-json="$SERVICE_SECRETS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -
