server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # The cluster ingress owns same-origin /api routing to Gateway. Never mask an
  # ingress mistake with the SPA shell if an API request reaches this container.
  location = /api {
    default_type application/json;
    return 404 '{"error":"gateway_route_required"}';
  }

  location ^~ /api/ {
    default_type application/json;
    return 404 '{"error":"gateway_route_required"}';
  }

  location ~* \.(?:css|js|mjs|map|woff2?|png|svg|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
