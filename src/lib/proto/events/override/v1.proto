syntax = "proto3";

package owomide.events.override.v1;

option go_package = "github.com/owomide/proto/events/override/v1";

import "google/protobuf/timestamp.proto";

message OverrideRequested {
  string org_id = 1;
  string proposal_id = 2;
  string override_request_id = 3;
  string actor_id = 4;
  string justification = 5;
  google.protobuf.Timestamp created_at = 6;
}

message OverrideApproved {
  string org_id = 1;
  string proposal_id = 2;
  string override_request_id = 3;
  string approver_id = 4;
  string requester_id = 5;
  google.protobuf.Timestamp created_at = 6;
}
