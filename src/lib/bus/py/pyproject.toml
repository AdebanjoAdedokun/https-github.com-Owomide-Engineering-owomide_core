[project]
name = "owomide-bus"
version = "0.1.0"
description = "Provider-agnostic event bus library for Owomide services"
requires-python = ">=3.10"
dependencies = [
    "aiokafka>=0.11",
    "protobuf>=5.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires running Kafka broker",
]
